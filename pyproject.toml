[project]
name = "ai-ecommerce-assistant-workspace"
version = "0.1.0"
description = "Local uv workspace for the two-service shopping assistant"
requires-python = ">=3.12"
dependencies = ["conversational-shopping-backend"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
conversational-shopping-backend = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
extend = "backend/pyproject.toml"
